[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", ".verify-venv", "test-results", "delivery"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend.app"]
omit = ["*/models.py"]

[tool.coverage.report]
show_missing = true
